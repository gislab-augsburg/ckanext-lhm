{% ckan_extends %}

{% block secondary_content %}
  <div class="filters lhm-facet-accordion">
    <button type="button" class="lhm-facet-toggle-all" data-lhm-facet-toggle-all aria-expanded="false">
      <i class="fa fa-filter" aria-hidden="true"></i>
      <span>{{ _('Datensätze filtern:') }}</span>
      <i class="fa fa-chevron-down lhm-facet-toggle-chevron" aria-hidden="true"></i>
    </button>
    <div class="lhm-facet-list">
      {% for facet in facet_titles %}
        {% snippet 'snippets/facet_list.html', title=facet_titles[facet], name=facet, search_facets=search_facets %}
      {% endfor %}
    </div>
    <a class="close no-text hide-filters"><i class="fa fa-times-circle"></i><span class="text">close</span></a>
  </div>
{% endblock %}
