{% block organization_tree %}
  {% if top_nodes %}
    <ul class="organization-tree">
      {% for node in top_nodes recursive %}
        <li>
          <a href="{{ h.lhm_organization_url(node) }}">{{ node.title or node.display_name or node.name }}</a>
          {% if node.children %}
            <ul>
              {{ loop(node.children) }}
            </ul>
          {% endif %}
        </li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
